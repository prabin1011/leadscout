var COMPANIES = [];
var API_BASE = window.location.origin;
var STORAGE_KEYS = {
  searchHistory:'leadscout.searchHistory.v1',
  seenPlaces:'leadscout.seenPlaces.v1'
};

function readStoredJson(key, fallback) {
  try {
    var value = window.localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

function writeStoredJson(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {}
}

function placeIdentity(place) {
  if (place && place.id) return String(place.id);
  var name = place && place.displayName && place.displayName.text ? place.displayName.text : '';
  return (name + '|' + (place && place.formattedAddress || '')).toLowerCase().replace(/\s+/g, ' ').trim();
}

function saveSearchHistoryEntry(entry) {
  var history = readStoredJson(STORAGE_KEYS.searchHistory, []);
  var key = (entry.query + '|' + entry.location).toLowerCase();
  history = history.filter(function(item) {
    return (item.query + '|' + item.location).toLowerCase() !== key;
  });
  history.unshift(entry);
  history = history.slice(0, 15);
  writeStoredJson(STORAGE_KEYS.searchHistory, history);
  return history;
}

function countryCodeFromLocation(loc) {
  var s = (loc || '').toLowerCase();
  if (/nepal|kathmandu|pokhara|lalitpur|bhaktapur/.test(s)) return 'NP';
  if (/india|delhi|mumbai|bangalore|bengaluru|chennai|kolkata|hyderabad/.test(s)) return 'IN';
  if (/uae|united arab emirates|dubai|abu dhabi/.test(s)) return 'AE';
  if (/singapore/.test(s)) return 'SG';
  if (/japan|tokyo|osaka|kyoto/.test(s)) return 'JP';
  if (/uk|united kingdom|england|london|manchester|birmingham/.test(s)) return 'GB';
  if (/italy|rome|milan|italia/.test(s)) return 'IT';
  if (/france|paris/.test(s)) return 'FR';
  if (/germany|berlin|munich/.test(s)) return 'DE';
  if (/spain|madrid|barcelona/.test(s)) return 'ES';
  if (/united states|usa|new york|los angeles|chicago|miami|austin|dallas/.test(s)) return 'US';
  if (/canada|toronto|vancouver/.test(s)) return 'CA';
  if (/new zealand|auckland|wellington/.test(s)) return 'NZ';
  if (/australia|sydney|melbourne|brisbane|perth|adelaide|canberra/.test(s)) return 'AU';
  return '';
}

function safeConnectorFetch(path, options) {
  return fetch(API_BASE + path, options || {}).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) {
        var err = new Error(data.message || 'Request failed');
        err.data = data;
        throw err;
      }
      return data;
    });
  });
}

function requestAnthropic(prompt, maxTokens, task) {
  return safeConnectorFetch('/api/anthropic/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:prompt, maxTokens:maxTokens, task:task || 'general'})
  });
}

function parseModelJson(response) {
  if (response && response.error) throw new Error(response.error.message || 'AI request failed.');
  var text = (response && response.content || []).map(function(block) { return block.text || ''; }).join('').replace(/```json|```/gi, '').trim();
  var start = text.indexOf('{');
  var end = text.lastIndexOf('}');
  if (start > -1 && end > start) text = text.slice(start, end + 1);
  return JSON.parse(text);
}

function verifyMetaAdsForCompanies(companies, loc, onLog, onUpdate) {
  var country = countryCodeFromLocation(loc);
  return safeConnectorFetch('/api/health').then(function(health) {
    if (!health || !health.metaConfigured) {
      companies.forEach(function(co) {
        co.metaSource = 'not_connected';
        co.metaStatus = 'needs_token';
        co.metaCoverageNote = 'Meta connector is ready, but META_ACCESS_TOKEN is not set on the local backend.';
      });
      onLog({t:'warn', m:'[META ADS] No META_ACCESS_TOKEN found. Meta advertising status remains unknown.'});
      onUpdate();
      return;
    }

    onLog({t:'info', m:'[META ADS] Meta API token found. Verifying Ad Library signals for ' + companies.length + ' companies...'});
    var chain = Promise.resolve();
    companies.forEach(function(co) {
      chain = chain.then(function() {
        co.metaStatus = 'checking';
        onUpdate();
        return safeConnectorFetch('/api/meta-ads/search', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({name:co.name, country:country, limit:8})
        }).then(function(data) {
          co.metaStatus = data.ok ? 'verified' : 'api_limited';
          co.metaSource = data.ok ? 'verified' : 'not_verified';
          co.metaVerified = !!data.ok;
          co.metaApi = data;
          co.metaAdsCount = data.totalReturned || 0;
          co.metaCoverageNote = data.coverageNote || data.message || 'Meta API did not return verified commercial-ad coverage for this market.';
          if (data.ok) {
            co.mads = data.totalReturned > 0;
            co.ms = data.totalReturned > 0 ? Math.min(95, 45 + data.totalReturned * 5) : 0;
            if (data.ads && data.ads[0]) {
              co.mt = data.ads[0].page_name || co.name;
              co.md = 'Verified via Meta Ad Library API. Review creative snapshot for exact copy and format.';
              co.mdur = data.ads[0].ad_delivery_start_time ? 'since ' + data.ads[0].ad_delivery_start_time : co.mdur;
            }
            onLog({t:'success', m:'[META ADS] Verified ' + co.name + ': ' + data.totalReturned + ' Ad Library records returned'});
          } else {
            onLog({t:'warn', m:'[META ADS] ' + co.name + ': API not conclusive (' + (data.reason || 'limited coverage') + ')'});
          }
          onUpdate();
        }).catch(function(err) {
          co.metaStatus = 'connector_error';
          co.metaSource = 'connector_error';
          co.metaCoverageNote = err.message;
          onLog({t:'warn', m:'[META ADS] ' + co.name + ': connector error - ' + err.message});
          onUpdate();
        });
      });
    });
    return chain;
  }).catch(function(err) {
    companies.forEach(function(co) {
      co.metaSource = 'connector_error';
      co.metaStatus = 'backend_offline';
      co.metaCoverageNote = err.message;
    });
    onLog({t:'warn', m:'[META ADS] Backend connector unavailable. Start server.js to enable verification.'});
    onUpdate();
  });
}

// ─── BUSINESS GENERATOR ──────────────────────────────────────────────────────
function generateCompanies(kw, loc, count) {
  var kwL = (kw || 'business').toLowerCase().trim();

  } else if (/physio|physiother/.test(kwL)) {
    cat='Physiotherapy'; kwTerms=['physiotherapy near me','sports physio','back pain treatment','physio clinic','physiotherapist'];
    nameTemplates=['{sub} Physiotherapy','{sub} Physio & Sports','{name} Physio','{sub} Sports Physio','Active {sub} Physio','{sub} Movement Clinic','{name} Physiotherapy','Total {sub} Physio','{sub} Rehab & Physio','Elite {sub} Physiotherapy','{sub} Health & Physio','{name} Sports Medicine'];

    catGroups=[['CrossFit','Strength','HIIT'],['Personal Training','Weight Loss','Nutrition'],['Yoga','Pilates','Mindfulness'],['Boxing','Martial Arts','Kickboxing'],['Functional Fitness','Group Classes','Cardio'],['Olympic Lifting','Powerlifting','Conditioning']];

    catGroups=[['Hair Styling','Colour','Keratin'],['Nails','Gel','Acrylic','Pedicure'],['Massage','Facials','Body Treatments'],['Lashes','Brows','Waxing'],['Skin Care','Anti-Aging','LED Therapy'],['Spray Tan','Makeup','Bridal']];
  } else if (/plumb|electrician|handyman|trade|builder|carpenter|painter/.test(kwL)) {

  } else {
    var kwCap = kwL.charAt(0).toUpperCase()+kwL.slice(1);

    nameTemplates=['{sub} '+kwCap,'{name} '+kwCap,'The {sub} '+kwCap,'{sub} Pro '+kwCap,'Premium {sub}','{name} & Co','{sub} '+kwCap+' Group','Expert {sub} '+kwCap,'{name} '+kwCap+' Services','Top {sub} '+kwCap,'{sub} '+kwCap+' Centre','{name}\'s '+kwCap];

  var hourOpts=['Mon-Fri 9am-5pm','Mon-Sat 8am-6pm','Mon-Fri 8am-7pm, Sat 9am-3pm','7 days 7am-10pm','Tue-Sun 10am-9pm','Mon-Fri 9am-6pm, Sat 10am-4pm','Mon-Sun 8am-8pm','Mon-Fri 8am-5:30pm','Mon-Sat 9am-7pm','7 days 6am-9pm'];

  var result = [];
  for (var i=0; i<count; i++) {
    var sub = suburbs[i % suburbs.length];
    var fn = firstNames[i % firstNames.length];
    var tmpl = nameTemplates[i % nameTemplates.length];
    var bizName = tmpl.replace(/\{sub\}/g, sub).replace(/\{name\}/g, fn);

    var founded = rnd(2003, 2022);
    var visits = Math.round(reviews * rndF(2, 10, 0));

    // Ad presence — realistic distribution
    var r = Math.random();
    var gads = r < 0.45;
    var mads = Math.random() < 0.42;
    var gs = gads ? rnd(40, 94) : 0;
    var ms = mads ? rnd(35, 91) : 0;
    var spend = gads && mads ? rnd(900,8500) : gads ? rnd(400,4200) : mads ? rnd(200,2100) : 0;
    var fatigue = mads && Math.random() > 0.5;
    var durDays = mads ? rnd(fatigue?32:3, fatigue?65:28) : 0;

    var rankBonus = Math.max(0,(12-rank)*3);
    var fatigueBonus = fatigue?10:0;
    var score = Math.min(98,Math.max(10,adGap+rankBonus+fatigueBonus+rnd(8,32)));
    var pri = score>=80?'high':score>=55?'medium':'low';
